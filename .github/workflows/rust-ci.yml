name: Rust CLI CI

on:
  push:
    paths:
      - "cli/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/rust-ci.yml"
  schedule:
    # Weekly RustSec audit every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Clippy & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Run unit tests
        run: cargo test --all-targets

  security-audit:
    name: RustSec Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Audit cli/Cargo.lock
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./cli

      - name: Check dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --manifest-path cli/Cargo.toml check
