[package]
name = "cinematex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
ratatui = "0.30.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["json", "multipart", "query"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }
toml = "1.2.3"
zeroize = { version = "1.9.2", features = ["derive"] }
